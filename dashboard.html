<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Galactic Obfuscator Dashboard</title>
<style>
body { font-family: Arial; padding: 20px; background: #f0f8ff; }
textarea { width: 100%; height: 150px; margin-bottom: 10px; }
button { padding: 10px 20px; cursor: pointer; }
</style>
</head>
<body>

<h2>Obfuscate Your Code</h2>

<label>Preset:</label>
<select id="preset">
  <option value="Minify">Minify</option>
  <option value="Weak">Weak</option>
  <option value="Medium" selected>Medium</option>
  <option value="Strong">Strong</option>
  <option value="DisableAntiTamper">DisableAntiTamper</option>
</select>

<h3>Input</h3>
<textarea id="inputCode" placeholder="Paste your code here"></textarea>

<h3>Output</h3>
<textarea id="outputCode" placeholder="Obfuscated code will appear here"></textarea>

<br>
<button onclick="obfuscateCode()">Obfuscate</button>

<script>
async function obfuscateCode() {
    const code = document.getElementById("inputCode").value;
    const preset = document.getElementById("preset").value;
    const output = document.getElementById("outputCode");

    output.value = "Processing...";

    try {
        const response = await fetch("http://localhost:3000/api/obfuscate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ code, preset })
        });

        const data = await response.json();
        if (data.status === "ok") {
            output.value = data.obfuscated;
        } else {
            output.value = "Error: " + data.error;
        }

    } catch (err) {
        output.value = "Network Error: " + err;
    }
}
</script>

</body>
</html>
