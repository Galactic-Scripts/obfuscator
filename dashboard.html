<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Galactic Obfuscator</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Fredoka One', sans-serif; }
        body { background: #e0f7ff; color: #222; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 40px; }

        h1 { color: #0077cc; margin-bottom: 30px; }

        .container { max-width: 800px; width: 100%; display: flex; flex-direction: column; gap: 20px; }

        textarea { width: 100%; min-height: 150px; padding: 15px; font-family: monospace; font-size: 16px; border-radius: 8px; border: 2px solid #0077cc; resize: vertical; }

        button { padding: 12px 20px; background: #0077cc; color: #fff; font-size: 16px; border: none; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        button:hover { background: #005fa3; }

        .output { background: #ffffff; border: 2px solid #0077cc; border-radius: 8px; padding: 15px; min-height: 150px; white-space: pre-wrap; overflow-x: auto; font-family: monospace; }

        .actions { display: flex; gap: 15px; margin-top: 10px; }

        .footer { margin-top: 40px; color: #0077cc; text-align: center; font-size: 14px; }
    </style>
</head>
<body>
    <h1>Galactic Obfuscator Dashboard</h1>

    <div class="container">
        <label for="inputCode">Enter your code:</label>
        <textarea id="inputCode" placeholder="Paste your Luau code here..."></textarea>

        <button id="obfuscateBtn">Obfuscate</button>

        <label for="outputCode">Obfuscated code:</label>
        <div id="outputCode" class="output">Your obfuscated code will appear here...</div>

        <div class="actions">
            <button id="copyBtn">Copy</button>
            <button id="downloadBtn">Download</button>
        </div>
    </div>

    <div class="footer">© 2026 Galactic Scripts</div>

    <script>
        const obfuscateBtn = document.getElementById('obfuscateBtn');
        const inputCode = document.getElementById('inputCode');
        const outputCode = document.getElementById('outputCode');
        const copyBtn = document.getElementById('copyBtn');
        const downloadBtn = document.getElementById('downloadBtn');

        obfuscateBtn.addEventListener('click', async () => {
            const code = inputCode.value.trim();
            if (!code) {
                alert("Please enter some code to obfuscate!");
                return;
            }

            outputCode.textContent = "Processing...";

            try {
                const response = await fetch("https://web-production-5cef0.up.railway.app/api/obfuscate", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "API-KEY": "V81mv3P4XdLeo17iUezz8KT5QFkM7g4Hl4b0eFYmqMca"
                    },
                    body: JSON.stringify({ code })
                });

                if (!response.ok) throw new Error("Server returned " + response.status);

                const data = await response.json();

                if (data.status === "ok") {
                    outputCode.textContent = data.obfuscated;
                } else {
                    outputCode.textContent = `Error: ${data.error || "Unknown error"}`;
                }
            } catch (err) {
                outputCode.textContent = "Network or server error!";
                console.error(err);
            }
        });

        copyBtn.addEventListener('click', () => {
            const text = outputCode.textContent.trim();
            if (!text) return alert("Nothing to copy!");
            navigator.clipboard.writeText(text).then(() => alert("Copied to clipboard!"));
        });

        downloadBtn.addEventListener('click', () => {
            const text = outputCode.textContent.trim();
            if (!text) return alert("Nothing to download!");
            const blob = new Blob([text], { type: "text/plain" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "obfuscated_code.lua";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });
    </script>
</body>
</html>
