<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Galactic Obfuscator</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
<style>
* {margin:0;padding:0;box-sizing:border-box;}
body {background: linear-gradient(135deg, #6dd5fa, #ffffff); color:#333; min-height:100vh; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display:flex; flex-direction:column;}
header {padding:20px 0; text-align:center; background:rgba(255,255,255,0.2); backdrop-filter: blur(8px);}
header h1 {font-family:'Fredoka One', cursive; font-size:2.5rem; color:#003366; letter-spacing:1px;}
nav {display:flex; justify-content:center; gap:20px; padding:15px 0; background:rgba(255,255,255,0.3); backdrop-filter: blur(5px);}
nav a {text-decoration:none; color:#003366; font-weight:bold; padding:8px 15px; border-radius:6px; transition:all 0.3s ease;}
nav a:hover {background:#003366; color:white;}
.main {flex:1; padding:50px 20px; max-width:800px; margin:auto; display:flex; flex-direction:column; gap:20px;}
textarea {width:100%; padding:15px; border-radius:8px; border:1px solid #ccc; font-family:monospace; font-size:1rem; resize:none; min-height:150px;}
.output-container {position:relative;}
.output {width:100%; padding:15px; border-radius:8px; border:1px solid #ccc; font-family:monospace; font-size:1rem; min-height:150px; overflow:auto; background:#f8f8f8; white-space:pre-wrap;}
button {padding:10px 25px; font-size:1rem; border:none; border-radius:6px; cursor:pointer; background:#003366; color:white; transition:0.3s;}
button:hover {background:#0055aa;}
.button-group {display:flex; justify-content:center; gap:15px; margin-top:10px;}
#obfuscate-btn {align-self:flex-start;}
</style>
</head>
<body>

<header>
<h1>Galactic Obfuscator</h1>
</header>

<nav>
<a href="index.html">Home</a>
<a href="dashboard.html">Dashboard</a>
</nav>

<div class="main">
<label for="code-input">Paste your Luau code here:</label>
<textarea id="code-input" placeholder="Paste your Luau code here"></textarea>
<button id="obfuscate-btn">Obfuscate</button>

<div class="output-container">
<div id="code-output" class="output"></div>
<div class="button-group">
<button id="copy-btn">Copy</button>
<button id="download-btn">Download</button>
</div>
</div>
</div>

<script>
const input = document.getElementById("code-input");
const output = document.getElementById("code-output");
const obfuscateBtn = document.getElementById("obfuscate-btn");
const copyBtn = document.getElementById("copy-btn");
const downloadBtn = document.getElementById("download-btn");

obfuscateBtn.addEventListener("click", async () => {
    const code = input.value.trim();
    if(!code) { alert("Please paste your code."); return; }

    output.textContent = "Obfuscating...";

    try {
        const res = await fetch("https://web-production-5cef0.up.railway.app/api/obfuscate", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "API-KEY": "V81mv3P4XdLeo17iUezz8KT5QFkM7g4Hl4b0eFYmqMca"
            },
            body: JSON.stringify({ code })
        });

        const data = await res.json();

        if(data.status === "ok") {
            output.textContent = data.obfuscated;
        } else {
            output.textContent = `Error: ${data.error || "Server returned an error"}`;
        }
    } catch(err) {
        output.textContent = "Network or server error!";
    }
});

// Copy to clipboard
copyBtn.addEventListener("click", () => {
    navigator.clipboard.writeText(output.textContent);
});

// Download as file
downloadBtn.addEventListener("click", () => {
    const blob = new Blob([output.textContent], { type: "text/plain" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "obfuscated.lua";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
});
</script>

</body>
</html>
