<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galactic Obfuscator - Dashboard</title>
<style>
    body {
        font-family: 'Fredoka', sans-serif;
        background: #87CEEB;
        color: #fff;
        text-align: center;
        padding: 50px;
    }
    textarea {
        width: 80%;
        height: 200px;
        margin: 20px 0;
        padding: 10px;
        font-family: monospace;
        font-size: 14px;
    }
    button {
        padding: 10px 20px;
        font-size: 16px;
        background: #fff;
        color: #87CEEB;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }
    button:hover {
        background: #f0f0f0;
    }
</style>
</head>
<body>

<h1>Galactic Obfuscator Dashboard</h1>

<h3>Paste Obfuscated Code:</h3>
<textarea id="inputCode" placeholder="Enter code here..."></textarea>

<br>
<button onclick="deobfuscateCode()">Deobfuscate</button>

<h3>Output:</h3>
<textarea id="outputCode" placeholder="Deobfuscated code will appear here..." readonly></textarea>

<script>
async function deobfuscateCode() {
    const inputCode = document.getElementById('inputCode').value;
    const outputBox = document.getElementById('outputCode');

    if (!inputCode.trim()) {
        alert('Please enter some code!');
        return;
    }

    outputBox.value = 'Processing...';

    try {
        const response = await fetch('http://localhost:3000/api/deobfuscate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code: inputCode })
        });

        if (!response.ok) throw new Error('Network response was not ok');

        const data = await response.json();

        if (data.status === 'ok') {
            outputBox.value = data.obfuscated || '';
        } else {
            outputBox.value = `Error: ${data.error}`;
        }
    } catch (err) {
        outputBox.value = `Network Error: ${err.message}`;
    }
}
</script>

</body>
</html>
