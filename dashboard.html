<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galactic Obfuscator Dashboard</title>
    <style>
        body {
            font-family: 'Fredoka One', sans-serif;
            background-color: #87CEEB;
            color: #000;
            text-align: center;
            padding: 50px;
        }
        textarea {
            width: 80%;
            height: 200px;
            margin: 10px 0;
            padding: 10px;
            font-family: monospace;
            font-size: 16px;
        }
        button {
            background-color: #1E90FF;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover {
            background-color: #0B65C2;
        }
    </style>
</head>
<body>

    <h1>Galactic Obfuscator</h1>
    
    <textarea id="codeInput" placeholder="Paste your code here..."></textarea><br>
    <button onclick="obfuscateCode()">Obfuscate</button><br>
    <textarea id="outputBox" placeholder="Obfuscated code will appear here..." readonly></textarea>

    <script>
async function obfuscateCode() {
    const code = document.getElementById("inputCode").value;
    const output = document.getElementById("outputCode");

    try {
        const response = await fetch("https://web-production-5cef0.up.railway.app/api/obfuscate", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "API-KEY": "V81mv3P4XdLeo17iUezz8KT5QFkM7g4Hl4b0eFYmqMca"
            },
            body: JSON.stringify({ code: code })
        });

        const data = await response.json();

        if (data.status === "ok") {
            output.value = data.obfuscated;
        } else {
            output.value = `Error: ${data.error}`;
        }
    } catch (err) {
        output.value = "Network or server error!";
        console.error(err);
    }
}
</script>

</body>
</html>
