<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galactic Obfuscator Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Fredoka One', sans-serif;
            background-color: #d0e7ff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            width: 100%;
            padding: 20px;
            background-color: #89c2ff;
            text-align: center;
            color: white;
            font-size: 2rem;
        }
        main {
            width: 90%;
            max-width: 800px;
            margin-top: 40px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        textarea {
            width: 100%;
            min-height: 150px;
            padding: 10px;
            font-family: monospace;
            font-size: 1rem;
            border-radius: 8px;
            border: 2px solid #89c2ff;
            resize: vertical;
        }
        #output {
            width: 100%;
            min-height: 150px;
            padding: 10px;
            font-family: monospace;
            font-size: 1rem;
            border-radius: 8px;
            border: 2px solid #89c2ff;
            background-color: #e6f0ff;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        button {
            padding: 10px 20px;
            font-family: 'Fredoka One', sans-serif;
            font-size: 1rem;
            background-color: #89c2ff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        button:hover {
            background-color: #5fa1ff;
        }
        #status {
            text-align: center;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>
    <header>Galactic Obfuscator</header>
    <main>
        <textarea id="codeInput" placeholder="Paste your Luau code here"></textarea>
        <button id="obfuscateBtn">Obfuscate</button>
        <div id="output"></div>
        <div class="buttons">
            <button id="copyBtn">Copy</button>
            <button id="downloadBtn">Download</button>
        </div>
        <div id="status"></div>
    </main>

    <script>
        const API_URL = "https://galactic-obfuscator.up.railway.app/api/obfuscate";
        const API_KEY = "V81mv3P4XdLeo17iUezz8KT5QFkM7g4Hl4b0eFYmqMca";

        const codeInput = document.getElementById("codeInput");
        const output = document.getElementById("output");
        const status = document.getElementById("status");
        const obfuscateBtn = document.getElementById("obfuscateBtn");
        const copyBtn = document.getElementById("copyBtn");
        const downloadBtn = document.getElementById("downloadBtn");

        obfuscateBtn.addEventListener("click", async () => {
            const code = codeInput.value.trim();
            if (!code) {
                status.textContent = "Please enter code to obfuscate.";
                return;
            }

            status.textContent = "Obfuscating...";
            output.textContent = "";

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "API-KEY": API_KEY
                    },
                    body: JSON.stringify({ code })
                });

                if (!response.ok) throw new Error(`Server returned ${response.status}`);

                const data = await response.json();
                if (data.status === "ok") {
                    output.textContent = data.obfuscated;
                    status.textContent = "Obfuscation complete!";
                } else {
                    status.textContent = "Error: " + (data.error || "Unknown error");
                }
            } catch (err) {
                console.error(err);
                status.textContent = "Network or server error!";
            }
        });

        copyBtn.addEventListener("click", () => {
            if (!output.textContent) return;
            navigator.clipboard.writeText(output.textContent);
            status.textContent = "Copied to clipboard!";
        });

        downloadBtn.addEventListener("click", () => {
            if (!output.textContent) return;
            const blob = new Blob([output.textContent], { type: "text/plain" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "obfuscated_code.lua";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            status.textContent = "Download started!";
        });
    </script>
</body>
</html>
