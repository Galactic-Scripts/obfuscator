<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Galactic Obfuscator</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">

<style>
* {margin:0;padding:0;box-sizing:border-box;}

body {
    background: linear-gradient(135deg, #6dd5fa, #ffffff);
    color:#333;
    min-height:100vh;
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display:flex;
    flex-direction:column;
}

header {
    padding:20px 0;
    text-align:center;
    background:rgba(255,255,255,0.2);
    backdrop-filter: blur(8px);
}

header h1 {
    font-family:'Fredoka One', cursive;
    font-size:2.5rem;
    color:#003366;
}

nav {
    display:flex;
    justify-content:center;
    gap:20px;
    padding:15px 0;
    background:rgba(255,255,255,0.3);
    backdrop-filter: blur(5px);
}

nav a {
    text-decoration:none;
    color:#003366;
    font-weight:bold;
    padding:8px 15px;
    border-radius:6px;
}

nav a:hover {
    background:#003366;
    color:white;
}

.main {
    flex:1;
    padding:30px 15px;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center; /* center everything */
    gap:20px;
}

/* Bigger + responsive textarea */
textarea {
    width:60%;
    padding:15px;
    border-radius:8px;
    border:1px solid #ccc;
    font-family:monospace;
    font-size:1rem;
    resize:vertical;
    min-height:250px;
}

/* Output hidden initially */
.output-container {
    display:none;
    flex-direction:column;
    gap:10px;
    width:60%;
}

.output {
    padding:15px;
    border-radius:8px;
    border:1px solid #ccc;
    font-family:monospace;
    background:#f8f8f8;
    white-space:pre-wrap;
}

button {
    padding:10px 25px;
    font-size:1rem;
    border:none;
    border-radius:6px;
    cursor:pointer;
    background:#003366;
    color:white;
}

button:hover {
    background:#0055aa;
}

.button-group {
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
}

/* Mobile scaling */
@media (max-width:600px) {
    textarea {
        min-height:300px;
        font-size:0.9rem;
    }
}
</style>
</head>

<body>

<header>
<h1>Galactic Obfuscator</h1>
</header>

<nav>
<a href="index.html">Home</a>
<a href="dashboard.html">Dashboard</a>

<div class="settings-wrapper">
    <button id="settings-btn">⚙️ Settings</button>

    <div id="settings-menu" class="settings-menu">
        <p><strong>Themes</strong></p>
        <button class="theme-btn" data-theme="light">Light</button>
        <button class="theme-btn" data-theme="dark">Dark</button>
        <button class="theme-btn" data-theme="system">System</button>
    </div>
</div>
</nav>

<script>
const input = document.getElementById("code-input");
const output = document.getElementById("code-output");
const container = document.getElementById("output-container");

const obfuscateBtn = document.getElementById("obfuscate-btn");
const copyBtn = document.getElementById("copy-btn");
const downloadBtn = document.getElementById("download-btn");

let lastResult = "";

// Generate random 14-letter string
function randomName(length = 14) {
    const chars = "abcdefghijklmnopqrstuvwxyz";
    let result = "";
    for(let i = 0; i < length; i++){
        result += chars[Math.floor(Math.random() * chars.length)];
    }
    return result;
}

// Get file size
function getSize(str) {
    return new Blob([str]).size;
}

obfuscateBtn.addEventListener("click", async () => {
    const code = input.value.trim();
    if(!code){
        alert("Please paste your code.");
        return;
    }

    container.style.display = "flex";
    output.textContent = "Obfuscating...";

    try {
        const res = await fetch("https://web-production-5cef0.up.railway.app/api/obfuscate", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ code })
        });

        const data = await res.json();

        if(data.status === "ok"){
            lastResult = data.obfuscated;

            const size = getSize(lastResult);

            output.textContent = 
                "Successfully Obfuscated!\n\n" +
                "File size: " + size + " bytes";
        } else {
            output.textContent = "Error Obfuscating: " + (data.error || "Server error");
        }

    } catch(e){
        output.textContent = "Error Obfuscating: Network issue";
    }
});

copyBtn.addEventListener("click", () => {
    if(!lastResult) return;
    navigator.clipboard.writeText(lastResult);
});

downloadBtn.addEventListener("click", () => {
    if(!lastResult) return;

    const blob = new Blob([lastResult], {type:"text/plain"});
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = randomName() + ".txt";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

    URL.revokeObjectURL(url);
});
</script>

</body>
</html>
