<!DOCTYPE html>
<html>
<head>
<title>Galactic Obfuscator</title>
<style>
body{
font-family: Arial;
background:#87CEEB;
padding:40px;
text-align:center;
}
textarea{
width:80%;
height:200px;
margin:10px;
}
button{
padding:10px 20px;
font-size:18px;
cursor:pointer;
}
</style>
</head>

<body>

<h1>Galactic Obfuscator</h1>

<textarea id="inputCode" placeholder="Paste code here"></textarea>

<br>

<button onclick="obfuscate()">Obfuscate</button>

<br>

<textarea id="outputCode" placeholder="Result will appear here"></textarea>

<script>
async function obfuscate(){

const code = document.getElementById("inputCode").value;

const response = await fetch("/obfuscate",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({code:code})
});

const data = await response.json();

if(data.status === "ok"){
document.getElementById("outputCode").value = data.obfuscated;
}else{
document.getElementById("outputCode").value = data.error;
}

}
</script>

</body>
</html>
