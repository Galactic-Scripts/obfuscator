<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galactic Obfuscator Dashboard</title>
<style>
    body { font-family: Arial, sans-serif; background: #f0f8ff; color: #333; padding: 20px; }
    h1 { text-align: center; color: #1a1aff; }
    textarea { width: 100%; height: 150px; margin: 10px 0; padding: 10px; font-family: monospace; font-size: 14px; }
    button { padding: 10px 20px; font-size: 16px; background: #1a1aff; color: white; border: none; cursor: pointer; }
    button:hover { background: #0000cc; }
    .output { white-space: pre-wrap; background: #e6f0ff; padding: 10px; margin-top: 10px; border: 1px solid #99ccff; min-height: 100px; }
</style>
</head>
<body>
<h1>Galactic Obfuscator</h1>

<label for="codeInput">Enter your code:</label>
<textarea id="codeInput" placeholder="Paste your code here..."></textarea>

<button id="obfuscateBtn">Obfuscate</button>

<h2>Obfuscated Code:</h2>
<div id="output" class="output"></div>

<script>
const obfuscateBtn = document.getElementById('obfuscateBtn');
const codeInput = document.getElementById('codeInput');
const output = document.getElementById('output');

obfuscateBtn.addEventListener('click', async () => {
    const code = codeInput.value.trim();
    if (!code) {
        output.textContent = 'Please enter some code first!';
        return;
    }

    output.textContent = 'Obfuscating...';

    try {
        const response = await fetch('https://web-production-5cef0.up.railway.app/api/obfuscate', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ code })
        });

        if (!response.ok) {
            throw new Error(`Server responded with ${response.status}`);
        }

        const data = await response.json();

        if (data.status === 'ok' && data.obfuscated) {
            output.textContent = data.obfuscated;
        } else if (data.status === 'Fail') {
            output.textContent = `Error: ${data.error || 'Unknown error'}`;
        } else {
            output.textContent = 'Unexpected response from server.';
        }
    } catch (err) {
        output.textContent = `Network or server error: ${err.message}`;
    }
});
</script>
</body>
</html>
