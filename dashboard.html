<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Galactic Obfuscator Dashboard</title>
<style>
body { font-family: Arial; padding: 20px; background: #f0f8ff; }
textarea { width: 100%; height: 150px; margin-bottom: 10px; }
button { padding: 10px 20px; cursor: pointer; }
</style>
</head>
<body>

<h2>Obfuscate Your Code</h2>

<h3>Input</h3>
<textarea id="inputCode" placeholder="Paste your code here"></textarea>

<h3>Output</h3>
<textarea id="outputCode" placeholder="Obfuscated code will appear here"></textarea>

<br>
<button onclick="obfuscateCode()">Obfuscate</button>

<script>
async function obfuscateCode() {
    const code = document.getElementById("inputCode").value;
    const output = document.getElementById("outputCode");
    output.value = "Processing...";

    try {
        const response = await fetch("https://galactic-obfuscator.up.railway.app/api/obfuscate", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "API-KEY": "V81mv3P4XdLeo17iUezz8KT5QFkM7g4Hl4b0eFYmqMca"
            },
            body: JSON.stringify({
                preset: "Medium",  // you can change this preset if you want
                code: code
            })
        });

        const data = await response.json();

        if (data.status === "ok") {
            output.value = data.obfuscated;
        } else {
            output.value = "Error: " + data.error;
        }

    } catch (err) {
        output.value = "Network Error: " + err;
    }
}
</script>

</body>
</html>
