<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Galactic Obfuscator</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
<style>
* {margin:0;padding:0;box-sizing:border-box;}
body {
    background: linear-gradient(135deg, #6dd5fa, #ffffff);
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding-top:50px;
    min-height:100vh;
    color:#333;
}
.container {
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(8px);
    padding:40px 30px;
    border-radius:12px;
    box-shadow:0 8px 25px rgba(0,0,0,0.15);
    max-width:600px;
    width:100%;
    text-align:center;
}
h1 {
    font-family:'Fredoka One', cursive;
    color:#003366;
    margin-bottom:25px;
}
textarea {
    width:100%;
    min-height:150px;
    padding:12px 15px;
    margin:10px 0;
    border-radius:8px;
    border:1px solid #ccc;
    font-size:1rem;
    font-family:monospace;
}
.button {
    display:inline-block;
    margin-top:20px;
    padding:12px 35px;
    font-size:1rem;
    background:#003366;
    color:white;
    border-radius:8px;
    text-decoration:none;
    border:none;
    cursor:pointer;
    transition:background 0.3s ease;
}
.button:hover {
    background:#0055aa;
}
label {
    display:block;
    text-align:left;
    margin-top:15px;
    font-weight:bold;
}
</style>
</head>
<body>

<div class="container">
<h1>Dashboard</h1>

<label for="inputCode">Enter Obfuscated Code:</label>
<textarea id="inputCode" placeholder="Paste your obfuscated code here..."></textarea>

<button class="button" onclick="deobfuscate()">Deobfuscate</button>

<label for="outputCode">Deobfuscated Code:</label>
<textarea id="outputCode" readonly placeholder="Deobfuscated code will appear here..."></textarea>
</div>

<script>
const API_KEY = "V81mv3P4XdLeo17iUezz8KT5QFkM7g4Hl4b0eFYmqMca";

async function deobfuscate() {
    const code = document.getElementById('inputCode').value;
    const output = document.getElementById('outputCode');

    if (!code) {
        alert("Please enter some code to deobfuscate.");
        return;
    }

    output.value = "Processing...";

    try {
        const response = await fetch("https://api.galactic-obfuscator.com/deobfuscate", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${API_KEY}`
            },
            body: JSON.stringify({ code: code })
        });

        if (!response.ok) throw new Error(`Server error: ${response.status}`);

        const data = await response.json();
        output.value = data.deobfuscatedCode || "No code returned.";
    } catch (err) {
        output.value = "Error: " + err.message;
    }
}
</script>

</body>
</html>
