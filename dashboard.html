<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galactic Obfuscator Dashboard</title>
<style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f0f8ff; }
    textarea { width: 100%; height: 200px; margin-bottom: 10px; }
    button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
</style>
</head>
<body>
<h1>Galactic Obfuscator</h1>

<label for="inputCode">Input Code:</label>
<textarea id="inputCode" placeholder="Paste your code here..."></textarea>

<button onclick="obfuscateCode()">Obfuscate</button>

<label for="outputCode">Obfuscated Code:</label>
<textarea id="outputCode" readonly placeholder="Result will appear here..."></textarea>

<script>
async function obfuscateCode() {
    const code = document.getElementById('inputCode').value;
    const output = document.getElementById('outputCode');

    if (!code) {
        alert('Please enter some code first!');
        return;
    }

    try {
        const response = await fetch('https://galactic-obfuscator.up.railway.app/api/obfuscate', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'API-KEY': 'V81mv3P4XdLeo17iUezz8KT5QFkM7g4Hl4b0eFYmqMca'
            },
            body: JSON.stringify({
                preset: 'Medium', // required by API
                code: code
            })
        });

        if (!response.ok) throw new Error('Network response not ok');

        const data = await response.json();

        if (data.status === 'ok') {
            output.value = data.obfuscated;
        } else {
            output.value = `Error: ${data.error}`;
        }

    } catch (err) {
        output.value = `Failed: ${err.message}`;
    }
}
</script>
</body>
</html>
