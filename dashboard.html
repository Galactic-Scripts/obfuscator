<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Galactic Obfuscator</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
<style>
* {margin:0;padding:0;box-sizing:border-box;}
body {background: linear-gradient(135deg, #6dd5fa, #ffffff); font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; min-height:100vh; color:#333;}
header {padding:20px 0; text-align:center; background: rgba(255,255,255,0.2); backdrop-filter: blur(8px);}
header h1 {font-family:'Fredoka One', cursive; color:#003366; font-size:2.8rem;}
nav {display:flex; justify-content:center; gap:25px; padding:15px 0; background: rgba(255,255,255,0.3); backdrop-filter: blur(5px);}
nav a {text-decoration:none; color:#003366; font-weight:bold; padding:8px 15px; border-radius:6px; transition:0.3s;}
nav a:hover {background:#003366; color:white;}
.container {max-width:900px; margin:50px auto; background: rgba(255,255,255,0.85); padding:30px; border-radius:12px; backdrop-filter: blur(8px);}
h2 {font-family:'Fredoka One', cursive; color:#003366; margin-bottom:20px; text-align:center;}
textarea {width:100%; padding:15px; margin:10px 0; border-radius:8px; border:1px solid #ccc; font-size:1rem; resize: vertical; min-height:150px;}
select {width:100%; padding:12px; margin:10px 0; border-radius:8px; border:1px solid #ccc; font-size:1rem;}
button {padding:15px 35px; font-size:1rem; background:#003366; color:white; border:none; border-radius:8px; cursor:pointer; transition:0.3s; margin-top:15px;}
button:hover {background:#0055aa;}
.output-box {margin-top:20px;}
</style>
</head>
<body>

<header>
<h1>Galactic Obfuscator Dashboard</h1>
</header>

<nav>
<a href="index.html">Home</a>
<a href="login.html">Logout</a>
</nav>

<div class="container">
<h2>Obfuscate Your Code</h2>
<textarea id="inputCode" placeholder="Paste your code here..."></textarea>
<select id="preset">
    <option value="Minify">Minify</option>
    <option value="Weak">Weak</option>
    <option value="Medium" selected>Medium</option>
    <option value="Strong">Strong</option>
    <option value="DisableAntiTamper">DisableAntiTamper</option>
</select>
<button onclick="obfuscateCode()">Obfuscate</button>

<div class="output-box">
<textarea id="outputCode" placeholder="Obfuscated code will appear here..." readonly></textarea>
</div>
</div>

<script>
async function obfuscateCode(){
    const code = document.getElementById('inputCode').value;
    const preset = document.getElementById('preset').value;
    const output = document.getElementById('outputCode');

    if(!code){
        alert("Please paste your code first.");
        return;
    }

    output.value = "Obfuscating...";

    try {
        const response = await fetch("https://galactic-obfuscator.up.railway.app/api/obfuscate", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "API-KEY": "V81mv3P4XdLeo17iUezz8KT5QFkM7g4Hl4b0eFYmqMca"
            },
            body: JSON.stringify({
                code: code,
                preset: preset
            })
        });

        if(!response.ok){
            output.value = `Error: ${response.status} ${response.statusText}`;
            return;
        }

        const data = await response.json();

        if(data.status === "ok"){
            output.value = data.obfuscated;
        } else {
            output.value = `Failed: ${data.error}`;
        }
    } catch (err){
        output.value = `Request failed: ${err}`;
    }
}
</script>

</body>
</html>
