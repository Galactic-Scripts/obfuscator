<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Galactic Obfuscator</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
<style>
* {margin:0;padding:0;box-sizing:border-box;}
body {background: linear-gradient(135deg, #6dd5fa, #ffffff); font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display:flex; justify-content:center; align-items:center; min-height:100vh; color:#333;}
.container {background: rgba(255,255,255,0.85); backdrop-filter: blur(8px); padding:50px 30px; border-radius:12px; box-shadow:0 8px 25px rgba(0,0,0,0.15); max-width:400px; width:100%; text-align:center;}
h1 {font-family:'Fredoka One', cursive; color:#003366; margin-bottom:25px;}
input {width:100%; padding:12px 15px; margin:10px 0; border-radius:8px; border:1px solid #ccc; font-size:1rem;}
.button {display:inline-block; margin-top:20px; padding:12px 35px; font-size:1rem; background:#003366; color:white; border-radius:8px; text-decoration:none; border:none; cursor:pointer; transition:background 0.3s ease;}
.button:hover {background:#0055aa;}
p {margin-top:15px; font-size:0.95rem;}
p a {color:#003366; text-decoration:none; font-weight:bold;}
p a:hover {text-decoration:underline;}
</style>
</head>
<body>

<div class="container">
<h1>Login</h1>
<input type="text" placeholder="Username" id="username">
<input type="password" placeholder="Password" id="password">
<button class="button" onclick="login()">Login</button>
<p>Don't have an account? <a href="register.html">Register</a></p>
</div>

<script>
function login(){
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    if(username && password){
        // Redirect to dashboard on success
        window.location.href = "dashboard.html";
    } else {
        alert("Please enter both username and password");
    }
}
</script>

</body>
</html>
