<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Galactic Obfuscator</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
<style>
  body {
    font-family: 'Fredoka One', sans-serif;
    background-color: #87ceeb;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }
  .container {
    background: white;
    padding: 2rem;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    width: 350px;
    text-align: center;
  }
  input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 6px; border: 1px solid #ccc; }
  button { padding: 10px 20px; background-color: #00aaff; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
  button:hover { background-color: #0088cc; }
</style>
</head>
<body>
<div class="container">
  <h2>Login</h2>
  <input type="text" id="username" placeholder="Username">
  <input type="password" id="password" placeholder="Password">
  <button onclick="login()">Login</button>
  <p id="status"></p>
</div>

<script>
async function login() {
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value.trim();
  const status = document.getElementById("status");

  if (!username || !password) {
    status.textContent = "Please fill all fields!";
    return;
  }

  try {
    const res = await fetch("https://database-production-88d3.up.railway.app/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();

    if (data.status === "ok") {
      status.textContent = "Login successful! Redirecting...";
      localStorage.setItem("user", username);
      setTimeout(() => { window.location.href = "dashboard.html"; }, 1000);
    } else {
      status.textContent = data.error || "Invalid credentials!";
    }
  } catch (err) {
    console.error(err);
    status.textContent = "Network or server error!";
  }
}
</script>
</body>
</html>
